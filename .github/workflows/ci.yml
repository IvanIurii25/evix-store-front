# Frontend CI — mirrors the backend gate (lint + format + typecheck + unit tests),
# tooling shape adopted from SmartSuggestApp (eslint/prettier/vitest/playwright).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (eslint)
        run: pnpm lint

      - name: Format check (prettier)
        run: pnpm format:check

      - name: Typecheck (astro check)
        run: pnpm typecheck

      - name: Unit tests + coverage gate (vitest, ≥90%)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: JS budget gate (size-limit ≤ 120 kB)
        run: pnpm size

  lighthouse:
    # Gates the live storefront home (a11y / best-practices / perf) against
    # production shop.evix.md (see lighthouserc.json). SEO is advisory (warn)
    # while the store is pre-launch noindex — flip it to error at launch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lighthouse CI (production)
        run: pnpm lhci
        env:
          CHROME_PATH: /usr/bin/google-chrome
