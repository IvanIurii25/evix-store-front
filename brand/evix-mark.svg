<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="evix">
  <defs>
    <linearGradient id="evixHex" x1="0.12" y1="0.9" x2="0.9" y2="0.12">
      <stop offset="0" stop-color="#436bef"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <!-- connected hexagon frame -->
  <path d="M64 16 L105.6 40 L105.6 88 L64 112 L22.4 88 L22.4 40 Z"
        fill="none" stroke="url(#evixHex)" stroke-width="4" stroke-linejoin="round"/>
  <!-- letter E -->
  <g stroke="#436bef" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M44 40 V88"/>
    <path d="M44 40 H78"/>
    <path d="M44 64 H70"/>
    <path d="M44 88 H78"/>
  </g>
  <!-- network nodes at vertices -->
  <circle cx="64"    cy="16"  r="5.5" fill="#06B6D4"/>
  <circle cx="105.6" cy="40"  r="5.5" fill="#06B6D4"/>
  <circle cx="105.6" cy="88"  r="5.5" fill="#436bef"/>
  <circle cx="64"    cy="112" r="5.5" fill="#436bef"/>
  <circle cx="22.4"  cy="88"  r="5.5" fill="#436bef"/>
  <circle cx="22.4"  cy="40"  r="5.5" fill="#436bef"/>
  <!-- central accent node on the middle arm -->
  <circle cx="70" cy="64" r="4.5" fill="#06B6D4"/>
</svg>
